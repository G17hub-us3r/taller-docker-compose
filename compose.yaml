name: alvaro-notas

services:
  db:
    image: postgres:16-alpine
    container_name: alvaro-notas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notes_db}
      POSTGRES_USER: ${POSTGRES_USER:-notes_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notes_pass_2026}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notes_user} -d ${POSTGRES_DB:-notes_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: alvaro-notas-app:1.0.0
    container_name: alvaro-notas-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-5089}:5000"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-notes_db}
      DB_USER: ${POSTGRES_USER:-notes_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-notes_pass_2026}
    networks:
      - app_network

volumes:
  db_data:
    name: alvaro_pgdata

networks:
  app_network:
    name: alvaro_net
    driver: bridge
